name: capstone-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-preprocessing.txt
      - run: python -m pip install -r requirements-preprocessing.txt
      - run: python -c "import bs4, markdownify, pdfplumber, lxml.etree"
      - run: python scripts/build_standalone.py --check
      - run: python -I -S src/capstone_compare.py --demo
      - run: python scripts/crosscheck_submission.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/make_demo.py
      - run: python src/capstone_compare.py calculate --request examples/demo.json
        env:
          RAG_DATA_DIR: data/demo
          RAG_CACHE_DIR: data/demo/index
